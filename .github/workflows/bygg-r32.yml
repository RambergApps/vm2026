name: Oppdater R32-oppsett fortløpende

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vm2026-data-update
  cancel-in-progress: false

jobs:
  bygg-r32:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install requests

      - name: Oppdater FIFA-kontroll
        run: python scripts/kontroller-fifa-r32.py --strict --skip-jina
        env:
          GITHUB_ACTIONS: 'true'
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: Bygg kampene som nå har begge lag klare
        run: python scripts/bygg-r32.py

      - name: Oppdater status og leaderboard
        run: python scripts/poengregning.py
        env:
          GITHUB_ACTIONS: 'true'
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: Commit R32-oppdateringen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.js data/*.json

          if git diff --cached --quiet; then
            echo "Ingen nye R32-data å committe"
          else
            git commit -m "Oppdater R32-oppsett $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
