name: Migrer historiske kampreferater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrer:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut hele Git-historikken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Samle tidligere kampposter
        run: python scripts/migrer-kampreferater.py

      - name: Lagre kampreferatarkivet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kampreferater.json
          if git diff --cached --quiet; then
            echo "Ingen nye historiske kampreferater"
          else
            git commit -m "Migrer historiske kampreferater"
            git push
          fi
