name: Oppdater VM 2026 Leaderboard
on:
  # Kjør hver halvtime under VM (11. juni - 19. juli)
  schedule:
    - cron: '7,37 * * * *'
  # Kjør automatisk når ny tipping-fil pushes
  push:
    paths:
      - 'tippinger/**'
      - 'data/manuelle-kamper.json'
  # Kjør manuelt fra GitHub-grensesnittet
  workflow_dispatch:
jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer avhengigheter
        run: pip install requests
      - name: Kjør poengregning
        run: python scripts/poengregning.py
        env:
          GITHUB_ACTIONS: true
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - name: Generer kampreferat
        run: python scripts/generer-historikk.py
        env:
          GITHUB_ACTIONS: true
      - name: Commit og push oppdatert data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Skriv alltid en gyldig JSON-timestamp slik at scheduled runs gir sporbarhet
          printf '{"sjekket":"%s"}\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > data/last-checked.json
          git add data/data.js data/status.json data/deltakere.json data/mangler-resultater.json data/manuelle-kamper.json data/last-checked.json data/fd_debug.json data/kamp-mapping.json data/kamppost.json data/kamp-referanser.json
          if git diff --cached --quiet; then
            echo "Ingen endringer å committe"
          else
            git commit -m "Auto: oppdater leaderboard $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
