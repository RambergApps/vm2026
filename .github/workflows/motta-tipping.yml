name: Motta tipping

on:
  repository_dispatch:
    types: [motta_tipping]

permissions:
  contents: write

jobs:
  lagre-tipping:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Lagre tipping som JSON
        run: |
          RUNDE='${{ github.event.client_payload.runde }}'
          NAVN='${{ github.event.client_payload.navn }}'
          DATA='${{ toJson(github.event.client_payload.data) }}'

          SAFE_NAVN=$(echo "$NAVN" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9æøå]/_/g')
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")

          mkdir -p "tippinger/$RUNDE"

          echo "$DATA" > "tippinger/$RUNDE/${SAFE_NAVN}_${TIMESTAMP}.json"

      - name: Commit tipping
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add tippinger/

          if git diff --cached --quiet; then
            echo "Ingen endringer å committe"
          else
            git commit -m "Motta tipping"
            git push
          fi
