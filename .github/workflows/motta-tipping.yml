name: Motta tipping

on:
  repository_dispatch:
    types: [motta_tipping]

permissions:
  contents: write

jobs:
  lagre-tipping:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Lagre tipping som JSON
        run: |
          RUNDE='${{ github.event.client_payload.runde }}'
          NAVN='${{ github.event.client_payload.navn }}'
          DATA='${{ toJson(github.event.client_payload.data) }}'

          SAFE_NAVN=$(echo "$NAVN" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9æøå]/_/g')
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")

          mkdir -p "tippinger/$RUNDE"

          echo "$DATA" > "tippinger/$RUNDE/${SAFE_NAVN}_${TIMESTAMP}.json"

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install requests

      - name: Kjør poengregning
        run: python scripts/poengregning.py
        env:
          GITHUB_ACTIONS: true
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: Commit tipping og oppdatert leaderboard-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tippinger/ data/data.js data/status.json data/deltakere.json data/mangler-resultater.json data/fd_debug.json data/kamp-mapping.json

          if git diff --cached --quiet; then
            echo "Ingen endringer å committe"
          else
            git commit -m "Motta tipping og oppdater leaderboard"
            git push
          fi
