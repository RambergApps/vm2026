name: Motta tipping

on:
  repository_dispatch:
    types: [motta_tipping]

permissions:
  contents: write

concurrency:
  group: motta-tipping
  cancel-in-progress: false

jobs:
  lagre-tipping:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Valider og lagre åpne tips og bonus
        env:
          RUNDE: ${{ github.event.client_payload.runde }}
          NAVN: ${{ github.event.client_payload.navn }}
          DATA_JSON: ${{ toJson(github.event.client_payload.data) }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import unicodedata
          from datetime import datetime, timezone
          from pathlib import Path

          RUNDER = {"r32", "r16", "qf", "sf", "final"}
          BONUS = {
              "r32":   {"id": "antall_uavgjort",      "type": "int", "min": 0, "max": 16},
              "r16":   {"id": "antall_nullen",        "type": "int", "min": 0, "max": 16},
              "qf":    {"id": "antall_ettmaalsseier", "type": "int", "min": 0, "max": 4},
              "sf":    {"id": "totale_maal",          "type": "int", "min": 0, "max": 40},
              "final": {"id": "begge_lag_scorer",     "type": "choice", "values": {"ja", "nei"}},
          }
          HELHET_IDS = {"flest_maal_lag", "totale_maal_utslag", "golden_boot"}
          MAALINTERVALLER = {"0_46", "47_77", "78_pluss"}

          runde = os.environ.get("RUNDE", "").strip()
          navn = os.environ.get("NAVN", "").strip()
          data = json.loads(os.environ.get("DATA_JSON", "{}"))

          if runde not in RUNDER:
              raise SystemExit(f"Ugyldig runde: {runde}")
          if not navn:
              raise SystemExit("Mangler navn")
          if not isinstance(data, dict):
              raise SystemExit("Ugyldig dataformat")

          def slug(value):
              value = str(value or "").lower().strip()
              value = value.replace("æ", "ae").replace("ø", "oe").replace("å", "aa")
              value = value.replace("ä", "ae").replace("ö", "oe").replace("ü", "ue")
              value = re.sub(r"[^a-z0-9]+", "_", value)
              return re.sub(r"_+", "_", value).strip("_") or "ukjent"

          def name_key(value):
              value = unicodedata.normalize("NFKD", str(value or "")).encode("ascii", "ignore").decode("ascii")
              return re.sub(r"\s+", " ", value).strip().casefold()

          participants_path = Path("data/deltakere.json")
          participants = []
          if participants_path.exists():
              try:
                  loaded = json.loads(participants_path.read_text(encoding="utf-8"))
                  participants = loaded if isinstance(loaded, list) else []
              except Exception:
                  participants = []

          by_participant_id = {
              str(item.get("id") or "").strip(): item
              for item in participants
              if isinstance(item, dict) and str(item.get("id") or "").strip()
          }
          by_participant_name = {
              name_key(item.get("navn")): item
              for item in participants
              if isinstance(item, dict) and name_key(item.get("navn"))
          }

          meta = data.setdefault("meta", {})
          requested_id = str(meta.get("deltaker_id") or "").strip()
          requested_type = str(meta.get("deltaker_type") or "").strip().lower()
          generated_id = slug(navn)
          existing_by_id = by_participant_id.get(requested_id) if requested_id else None
          existing_by_name = by_participant_name.get(name_key(navn))

          if requested_type == "sen_pamelding":
              if requested_id and requested_id != generated_id:
                  raise SystemExit("Deltaker-ID matcher ikke navnet")
              canonical_id = generated_id
              existing = by_participant_id.get(canonical_id)
              if existing:
                  existing_type = str(existing.get("deltaker_type") or "ordinaer")
                  if name_key(existing.get("navn")) != name_key(navn):
                      raise SystemExit("Deltaker-ID er allerede i bruk av et annet navn")
                  if existing_type != "sen_pamelding":
                      raise SystemExit("Navnet finnes allerede som ordinær deltaker. Velg navnet fra listen.")
              if existing_by_name and str(existing_by_name.get("id")) != canonical_id:
                  raise SystemExit("Navnet finnes allerede med en annen deltaker-ID")
              canonical_type = "sen_pamelding"
          else:
              existing = existing_by_id or existing_by_name
              if not existing:
                  raise SystemExit("Ukjent deltaker. Velg navnet fra listen eller bruk 'Opprett ny deltaker'.")
              if name_key(existing.get("navn")) != name_key(navn):
                  raise SystemExit("Valgt deltaker-ID og navn samsvarer ikke")
              canonical_id = str(existing.get("id"))
              canonical_type = str(existing.get("deltaker_type") or "ordinaer")

          meta["deltaker_id"] = canonical_id
          meta["deltaker_type"] = canonical_type

          status = json.loads(Path("data/status.json").read_text(encoding="utf-8"))
          round_data = status.get(runde) or {}
          round_matches = round_data.get("kamper") or []
          by_id = {str(match.get("id")): match for match in round_matches if match.get("id")}
          now = datetime.now(timezone.utc)

          def parse_utc(value):
              if not value:
                  return None
              try:
                  dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return None

          def known_team(value):
              text = str(value or "").strip()
              low = text.lower()
              if not text or "/" in text:
                  return False
              if re.fullmatch(r"[123][A-L]", text, re.I) or re.fullmatch(r"W\d+", text, re.I):
                  return False
              return not any(word in low for word in ("winner", "loser", "path", "tbd", "place", "runner"))

          submitted = parse_utc((data.get("meta") or {}).get("innlevert"))
          if submitted is None:
              raise SystemExit("Mangler gyldig innleveringstidspunkt")
          if submitted > now and (submitted - now).total_seconds() > 300:
              raise SystemExit("Innleveringstidspunktet ligger for langt frem i tid")

          # Første bekreftede UTC-avspark er felles frist for rundebonus.
          bonus_times = [parse_utc(match.get("utcDate")) for match in round_matches]
          bonus_times = [value for value in bonus_times if value]
          bonus_deadline = min(bonus_times) if bonus_times else parse_utc(round_data.get("frist"))
          bonus_open = bool(bonus_deadline and submitted < bonus_deadline)

          valid_tips = []
          rejected_tips = []
          for tip in data.get("tippinger", []) or []:
              if not isinstance(tip, dict):
                  continue
              kamp_id = str(tip.get("kamp_id", "")).strip()
              match = by_id.get(kamp_id)
              kickoff = parse_utc((match or {}).get("utcDate"))
              home = tip.get("hjemme")
              away = tip.get("borte")
              scores_ok = (
                  isinstance(home, int) and not isinstance(home, bool) and home >= 0
                  and isinstance(away, int) and not isinstance(away, bool) and away >= 0
              )
              open_at_submission = bool(match and kickoff and submitted < kickoff)
              if open_at_submission and scores_ok:
                  valid_tips.append(tip)
              else:
                  rejected_tips.append(kamp_id or "<mangler kamp_id>")

          valid_bonus = None
          raw_bonus = data.get("bonus")
          if isinstance(raw_bonus, dict) and raw_bonus:
              config = BONUS[runde]
              bonus_id = str(raw_bonus.get("id", "")).strip()
              answer = raw_bonus.get("svar")
              answer_ok = False
              if config["type"] == "int":
                  answer_ok = (
                      isinstance(answer, int) and not isinstance(answer, bool)
                      and config["min"] <= answer <= config["max"]
                  )
              else:
                  answer_ok = str(answer or "").strip().lower() in config["values"]
                  if answer_ok:
                      answer = str(answer).strip().lower()
              if bonus_open and bonus_id == config["id"] and answer_ok:
                  valid_bonus = {"id": bonus_id, "svar": answer}
              else:
                  print(f"Avviser rundebonus for {runde}: frist/id/svar er ikke gyldig")

          valid_helhet = {}
          raw_helhet = data.get("helhetsbonus")
          if isinstance(raw_helhet, dict) and raw_helhet:
              if runde != "r32" or not bonus_open:
                  print("Avviser helhetsbonus: R32-fristen er passert eller mangler")
              else:
                  r32_teams = {
                      str(team).strip()
                      for match in (status.get("r32") or {}).get("kamper", []) or []
                      for team in (match.get("hjemme"), match.get("borte"))
                      if known_team(team)
                  }
                  for bonus_id, answer in raw_helhet.items():
                      if bonus_id not in HELHET_IDS or answer in (None, ""):
                          continue
                      if bonus_id == "totale_maal_utslag":
                          answer = str(answer).strip()
                          if answer in MAALINTERVALLER:
                              valid_helhet[bonus_id] = answer
                      elif bonus_id == "flest_maal_lag":
                          answer = str(answer).strip()
                          if answer in r32_teams:
                              valid_helhet[bonus_id] = answer
                      elif bonus_id == "golden_boot":
                          answer = re.sub(r"\s+", " ", str(answer)).strip()
                          if 1 <= len(answer) <= 100:
                              valid_helhet[bonus_id] = answer

          if not valid_tips and not valid_bonus and not valid_helhet:
              raise SystemExit("Ingen gyldige, åpne kamptips eller bonusbesvarelser i innleveringen")

          data["tippinger"] = valid_tips
          if valid_bonus:
              data["bonus"] = valid_bonus
          else:
              data.pop("bonus", None)
          if valid_helhet:
              data["helhetsbonus"] = valid_helhet
          else:
              data.pop("helhetsbonus", None)

          data.setdefault("meta", {})["server_mottatt"] = now.strftime("%Y-%m-%dT%H:%M:%SZ")
          data["meta"]["navn"] = navn
          data["meta"]["runde"] = runde
          data["meta"]["deltaker_id"] = canonical_id
          data["meta"]["deltaker_type"] = canonical_type

          safe = canonical_id
          timestamp = now.strftime("%Y%m%d_%H%M%S")
          run_id = os.environ.get("GITHUB_RUN_ID", "local")
          target_dir = Path("tippinger") / runde
          target_dir.mkdir(parents=True, exist_ok=True)
          target = target_dir / f"{safe}_{timestamp}_{run_id}.json"
          target.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print(
              f"Lagret {len(valid_tips)} kamptips, "
              f"{1 if valid_bonus else 0} rundebonus og "
              f"{len(valid_helhet)} helhetsbonus i {target}"
          )
          if rejected_tips:
              print("Avviste kamptips: " + ", ".join(rejected_tips))
          PY

      - name: Installer avhengigheter
        run: pip install requests

      - name: Kjør poengregning
        run: python scripts/poengregning.py
        env:
          GITHUB_ACTIONS: 'true'
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: Commit tipping og oppdatert leaderboard-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tippinger/ data/data.js data/status.json data/deltakere.json data/mangler-resultater.json data/fd_debug.json data/kamp-mapping.json

          if git diff --cached --quiet; then
            echo "Ingen endringer å committe"
          else
            git commit -m "Motta tipping og oppdater leaderboard"
            git push
          fi
