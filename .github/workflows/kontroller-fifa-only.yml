name: Kontroller FIFA-only v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/kontroller-fifa-only.py'
      - '.github/workflows/kontroller-fifa-only-v2.yml'

permissions:
  contents: write

jobs:
  fifa-only-kontroll:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kjør uavhengig FIFA-kontroll
        run: python scripts/kontroller-fifa-only.py

      - name: Vis kort oppsummering fra rapport
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/fifa-only-kontroll.json')
          if not path.exists():
              raise SystemExit('FEIL: data/fifa-only-kontroll.json ble ikke funnet etter kontrollkjøring')

          report = json.loads(path.read_text(encoding='utf-8'))
          summary = report.get('oppsummering', {})
          avvik = report.get('avvik', [])

          print('FIFA-only oppsummering:')
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          if avvik:
              print('\nAvvik:')
              for item in avvik:
                  print(json.dumps(item, ensure_ascii=False, indent=2))
          else:
              print('\nIngen avvik funnet.')
          PY

      - name: Commit og push FIFA-only rapport
        run: |
          set -e

          if [ ! -f data/fifa-only-kontroll.json ]; then
            echo "FEIL: data/fifa-only-kontroll.json finnes ikke"
            exit 1
          fi

          echo "Status før git add:"
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f data/fifa-only-kontroll.json

          echo "Status etter git add:"
          git status --short

          if git diff --cached --quiet; then
            echo "Ingen endring i fifa-only-kontroll.json"
            exit 0
          fi

          git commit -m "Auto: oppdater FIFA-only kontroll $(date -u +'%Y-%m-%d %H:%M UTC')"

          BRANCH="${GITHUB_REF_NAME}"
          if [ -z "$BRANCH" ]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          echo "Pusher til branch: $BRANCH"
          git push origin "HEAD:${BRANCH}"
