name: Kontroller FIFA only

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/kontroller-fifa-only.py'
      - '.github/workflows/kontroller-fifa-only.yml'
      - 'data/status.json'
      - 'data/manuelle-kamper.json'

permissions:
  contents: write

concurrency:
  group: kontroller-fifa-only
  cancel-in-progress: false

jobs:
  kontroller-fifa-only:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: python -m pip install --upgrade requests

      - name: Kjør uavhengig FIFA-kontroll
        run: python scripts/kontroller-fifa-only.py

      - name: Vis kort oppsummering fra rapport
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/fifa-only-kontroll.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          summary = report.get('oppsummering', {})

          print('FIFA-only oppsummering:')
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          avvik = [k for k in report.get('kamper', []) if k.get('status') != 'ok']
          if avvik:
              print('\nAvvik:')
              for kamp in avvik:
                  fifa = kamp.get('fifa') or {}
                  print(json.dumps({
                      'match_no': kamp.get('match_no'),
                      'status': kamp.get('status'),
                      'fifa_hjemme': fifa.get('fifa_hjemme'),
                      'fifa_borte': fifa.get('fifa_borte'),
                      'fifa_utcDate': fifa.get('fifa_utcDate'),
                      'status_json': {
                          'lagret_utcDate': (kamp.get('status_json') or {}).get('lagret_utcDate'),
                          'avvik_minutter': (kamp.get('status_json') or {}).get('avvik_minutter'),
                          'funn': (kamp.get('status_json') or {}).get('funn'),
                      },
                      'manuelle_kamper_json': {
                          'lagret_utcDate': (kamp.get('manuelle_kamper_json') or {}).get('lagret_utcDate'),
                          'avvik_minutter': (kamp.get('manuelle_kamper_json') or {}).get('avvik_minutter'),
                          'funn': (kamp.get('manuelle_kamper_json') or {}).get('funn'),
                      },
                  }, ensure_ascii=False, indent=2))
          else:
              print('\nIngen avvik funnet.')
          PY

      - name: Commit rapport hvis endret
        run: |
          if git diff --quiet -- data/fifa-only-kontroll.json; then
            echo "Ingen endring i fifa-only-kontroll.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fifa-only-kontroll.json
          git commit -m "Oppdater FIFA-only kontrollrapport"
          git push
