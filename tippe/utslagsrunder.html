<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VM 2026 — Utslagsrunder</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  print-color-adjust: exact; -webkit-print-color-adjust: exact;
}
:root {
  --bg:      #0a0f1e;
  --surface: #111827;
  --card:    #1a2235;
  --border:  #2a3650;
  --accent:  #00e676;
  --accent2: #ffd600;
  --red:     #ff4444;
  --text:    #f0f4ff;
  --muted:   #7a8aaa;
  --locked:  #1a1f2e;
}
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── HERO ── */
.hero {
  background: linear-gradient(135deg, #0a0f1e 0%, #0d1f3c 50%, #0a1628 100%);
  border-bottom: 1px solid var(--border);
  padding: 32px 24px 28px;
  text-align: center;
}
.hero .badge {
  display: inline-block;
  background: var(--accent2);
  color: #000;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 11px;
  letter-spacing: .15em;
  padding: 4px 12px;
  border-radius: 2px;
  margin-bottom: 12px;
}
.hero h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(28px, 6vw, 52px);
  font-weight: 900;
  text-transform: uppercase;
  line-height: .95;
}
.hero h1 span { color: var(--accent2); }
.hero p { margin-top: 8px; color: var(--muted); font-size: 13px; }

/* ── RUNDE-TABS ── */
.runde-tabs {
  display: flex;
  gap: 0;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 0 16px;
}
.runde-tab {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 14px 16px;
  color: var(--muted);
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: all .2s;
}
.runde-tab:hover { color: var(--text); }
.runde-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
.runde-tab.locked { color: #3a4a65; cursor: default; }
.runde-tab.done { color: var(--accent); }
.runde-tab .dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-left: 6px;
  vertical-align: middle;
}

/* ── PROGRESS ── */
.progress-bar-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-bar-wrap .label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  white-space: nowrap;
  text-transform: uppercase;
}
.progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent2); border-radius: 3px; transition: width .3s; width: 0%; }
.progress-count { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; color: var(--accent2); white-space: nowrap; }

/* ── CONTAINER ── */
.container { max-width: 680px; margin: 0 auto; padding: 24px 16px 80px; }

/* ── RUNDE-SEKSJON ── */
.runde-seksjon { display: none; }
.runde-seksjon.active { display: block; }

/* ── RUNDE-HEADER ── */
.runde-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.runde-tag {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  background: var(--accent2);
  color: #000;
  padding: 3px 10px;
  border-radius: 3px;
}
.runde-header h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
}
.runde-header .poeng-info {
  margin-left: auto;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  color: var(--muted);
}
.runde-header .poeng-info span { color: var(--accent2); font-weight: 700; }

/* ── KAMP-KORT ── */
.kamp-kort {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 0;
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color .2s;
  page-break-inside: avoid;
}
.kamp-kort:hover { border-color: #3a4a65; }
.kamp-kort.locked-kamp {
  opacity: .5;
  pointer-events: none;
  background: var(--locked);
}

/* Lag-rader */
.lag-rad {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  padding: 12px 16px;
  transition: background .15s;
  gap: 12px;
}
.lag-rad:hover { background: rgba(255,255,255,.03); }
.lag-rad.valgt { background: rgba(0,230,118,.08); }
.lag-rad.valgt .lag-navn { color: var(--accent); }
.lag-rad + .lag-rad { border-top: 1px solid var(--border); }

.lag-navn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .02em;
  transition: color .15s;
}
.lag-gruppe {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
}

/* Score-input */
.score-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.score-input-felt {
  width: 40px; height: 40px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  outline: none;
  transition: border-color .2s;
  -moz-appearance: textfield;
}
.score-input-felt::-webkit-inner-spin-button,
.score-input-felt::-webkit-outer-spin-button { -webkit-appearance: none; }
.score-input-felt:focus { border-color: var(--accent2); }
.score-input-felt.filled { border-color: rgba(255,214,0,.4); }
.score-sep {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 900;
  color: var(--muted);
}




/* ── IKKE ÅPEN ── */
.ikke-aapen {
  text-align: center;
  padding: 48px 24px;
  color: var(--muted);
}
.ikke-aapen .ikon { font-size: 48px; margin-bottom: 16px; }
.ikke-aapen h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text);
  margin-bottom: 8px;
}
.ikke-aapen p { font-size: 14px; }

/* ── NAVN-INPUT ── */
.navn-wrap {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.navn-wrap label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.navn-wrap input,
.navn-wrap select {
  flex: 1;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 15px;
  font-family: 'Barlow', sans-serif;
  outline: none;
}
.navn-wrap input:focus,
.navn-wrap select:focus { border-color: var(--accent2); }
.navn-wrap select option { background: var(--surface); color: var(--text); }

/* ── LEVER-KNAPP ── */
.lever-wrap { margin-top: 24px; }
.btn-lever {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 14px 40px;
  border-radius: 6px;
  border: none;
  background: var(--accent2);
  color: #000;
  width: 100%;
  transition: all .2s;
}
.btn-lever:hover { background: #ffe033; transform: translateY(-1px); }
.btn-lever:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

/* ── SUKSESS ── */
.suksess {
  text-align: center;
  padding: 48px 24px;
  max-width: 480px;
  margin: 0 auto;
  display: none;
}
.suksess.vis { display: block; }
.suksess .emoji { font-size: 56px; margin-bottom: 16px; }
.suksess h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 32px;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.suksess p { color: var(--muted); font-size: 14px; }

/* ── ERROR ── */
.error-box {
  background: rgba(255,68,68,.1);
  border: 1px solid rgba(255,68,68,.3);
  border-radius: 8px;
  padding: 12px 16px;
  color: #ff8888;
  margin: 12px 0;
  font-size: 13px;
}
.advarsel-box {
  background: rgba(255,214,0,.08);
  border: 1px solid rgba(255,214,0,.25);
  border-radius: 8px;
  padding: 12px 16px;
  color: var(--accent2);
  margin: 12px 0;
  font-size: 13px;
}


.autofill-wrap {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin:0 0 20px;
}
.autofill-note {
  width:100%;
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:-4px;
}
.btn-autofill {
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:11px 22px;
  border-radius:6px;
  cursor:pointer;
  background:rgba(255,214,0,.12);
  color:var(--accent2);
  border:1.5px solid rgba(255,214,0,.35);
  transition:all .2s;
}
.btn-autofill:hover {
  background:rgba(255,214,0,.18);
  border-color:var(--accent2);
}


/* ── FORTLØPENDE KAMPÅPNING ── */
.runde-oppsummering {
  margin: -8px 0 14px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  color: var(--muted);
  font-size: 13px;
}
.runde-oppsummering strong { color: var(--text); }
.kamp-status {
  padding: 7px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.kamp-status.open { color: var(--accent); background: rgba(0,230,118,.06); }
.kamp-status.saved { color: var(--accent2); background: rgba(255,214,0,.06); }
.kamp-status.locked { color: var(--muted); background: rgba(122,138,170,.05); }
.kamp-kort.locked-kamp {
  opacity: .72;
  pointer-events: auto;
}
.kamp-kort.locked-kamp .score-input-felt { cursor: not-allowed; opacity: .55; }
.btn-autofill:disabled { opacity: .45; cursor: not-allowed; }

.kamp-kort.deep-link-target {
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px rgba(255,214,0,.14), 0 12px 36px rgba(0,0,0,.28);
  animation: deepLinkPulse 1.3s ease 2;
}
@keyframes deepLinkPulse {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

@media (max-width: 480px) {
  .lag-navn { font-size: 15px; }
  .runde-tab { padding: 12px 10px; font-size: 11px; }
}
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}
</style>
</head>
<body>

<div class="hero">
  <div class="badge">⚽ VM 2026 · Utslagsrunder</div>
  <h1>Tipp <span>utslagsrundene</span></h1>
  <p>Tipp resultat etter ordinær tid / 90 min. Ekstraomganger og straffer teller ikke.</p>
</div>

<!-- TABS -->
<div class="runde-tabs" id="rundeTabs"></div>

<!-- PROGRESS -->
<div class="progress-bar-wrap">
  <span class="label">Fullført</span>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <span class="progress-count" id="progressCount">0 / 0</span>
</div>

<div class="container">

  <!-- DELTAKER / NAVN -->
  <div class="navn-wrap">
    <label id="navnLabel">Ditt navn</label>
    <!-- Dropdown: vises når deltakere.json er lastet. Skjult ID — kun navn vises. -->
    <select id="deltakerSelect" style="display:none" aria-label="Velg deg selv">
      <option value="">— Velg deg selv —</option>
    </select>
    <!-- Tekstfelt: fallback og skjult kilde for navn-verdi ved levering -->
    <input type="text" id="navnInput" placeholder="Kari Nordmann" autocomplete="name">
  </div>

  <!-- RUNDE-SEKSJONER genereres dynamisk -->
  <div id="rundeSeksjoner"></div>

  <!-- SUKSESS -->
  <div class="suksess" id="suksess">
    <div class="emoji">🎉</div>
    <h2>Tipping levert!</h2>
    <p id="suksessNavn"></p>
  </div>

</div><!-- /container -->

<script>
// ── KONFIG ─────────────────────────────────────────────────
const SUBMIT_URL    = "https://vm2026-submit-api.vercel.app/api/submit";
const TOKEN         = "vm2026-ramberg";
const STATUS_URL    = "../data/status.json";
const DELTAKERE_URL = "../data/deltakere.json";

const POENG = { r32: 3, r16: 4, qf: 5, sf: 6, final: 7 };
const RUNDE_NAVN = {
  r32: "Runde av 32",
  r16: "Runde av 16",
  qf: "Kvartfinale",
  sf: "Semifinale",
  final: "Finale"
};
const RUNDE_REKKEFØLGE = ["r32", "r16", "qf", "sf", "final"];

// ── STATE ──────────────────────────────────────────────────
let status = null;
let tippinger = {};
let aktivRunde = null;
let deltakerId = null;

const deepLinkParams = new URLSearchParams(window.location.search);
const deepLinkRunde = deepLinkParams.get("runde");
const deepLinkKamp = Number(deepLinkParams.get("kamp"));
let deepLinkFokusert = false;

window.addEventListener("DOMContentLoaded", async () => {
  lastFraStorage();
  await Promise.all([hentDeltakere(), hentStatus()]);
});

async function hentStatus() {
  try {
    const response = await fetch(STATUS_URL + "?t=" + Date.now());
    if (!response.ok) throw new Error("Kunne ikke hente status.json");
    status = await response.json();
  } catch (error) {
    status = {
      r32: { aapen: true, kamper: demoKamper("r32") },
      r16: { aapen: false, kamper: [] },
      qf: { aapen: false, kamper: [] },
      sf: { aapen: false, kamper: [] },
      final: { aapen: false, kamper: [] }
    };
  }
  byggUI();
}

// ── DELTAKERE ──────────────────────────────────────────────
async function hentDeltakere() {
  try {
    const response = await fetch(DELTAKERE_URL + "?t=" + Date.now());
    if (!response.ok) return;
    const data = await response.json();
    if (Array.isArray(data) && data.length > 0) byggDeltakerDropdown(data);
  } catch (error) {
    // Tekstfeltet beholdes som fallback.
  }
}

function byggDeltakerDropdown(deltakere) {
  const select = document.getElementById("deltakerSelect");
  const input = document.getElementById("navnInput");
  const label = document.getElementById("navnLabel");

  deltakere.sort((a, b) => a.navn.localeCompare(b.navn, "no"));
  deltakere.forEach(deltaker => {
    const option = document.createElement("option");
    option.value = deltaker.id;
    option.textContent = deltaker.navn;
    select.appendChild(option);
  });

  const lagretId = localStorage.getItem("vm2026_deltaker_id");
  if (lagretId) {
    const funnet = deltakere.find(d => d.id === lagretId);
    if (funnet) {
      select.value = lagretId;
      deltakerId = lagretId;
      input.value = funnet.navn;
    }
  }

  select.addEventListener("change", () => {
    const funnet = deltakere.find(d => d.id === select.value);
    if (funnet) {
      deltakerId = funnet.id;
      input.value = funnet.navn;
      localStorage.setItem("vm2026_deltaker_id", deltakerId);
    } else {
      deltakerId = null;
      input.value = "";
      localStorage.removeItem("vm2026_deltaker_id");
    }
    lagreTilStorage();
    if (status) byggUI();
  });

  select.style.display = "";
  input.style.display = "none";
  label.textContent = "Hvem er du?";
}

// ── DEMO ───────────────────────────────────────────────────
function demoKamper(runde) {
  if (runde !== "r32") return [];
  const kickoff = "2099-06-28T19:00:00Z";
  return [
    { id: "Spain_Panama_2099_06_28", hjemme: "Spain", borte: "Panama", dato: "2099-06-28", utcDate: kickoff, tippebar: true, info: "" },
    { id: "1E_3A_B_C_D_F_2099_06_29", hjemme: "1E", borte: "3A/B/C/D/F", dato: "2099-06-29", tippebar: false, tippe_status: "venter_pa_lag", info: "" }
  ];
}

// ── HJELPEFUNKSJONER ───────────────────────────────────────
function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function parseKickoff(kamp) {
  if (!kamp?.utcDate) return null;
  const timestamp = Date.parse(kamp.utcDate);
  return Number.isFinite(timestamp) ? timestamp : null;
}

function erKampTippebar(kamp) {
  if (!kamp || kamp.tippebar !== true) return false;
  const kickoff = parseKickoff(kamp);
  return kickoff === null || Date.now() < kickoff;
}

function kampStatusTekst(kamp) {
  if (erKampTippebar(kamp)) {
    return erKampLevert(kamp.id)
      ? "✓ Tips lagret – kan oppdateres frem til avspark"
      : "Åpen for tipping";
  }
  if (kamp?.tippe_status === "startet") return "Tippingen er stengt – kampen har startet";
  if (kamp?.tippe_status === "mangler_avsparkstid") return "Venter på bekreftet avsparkstid";
  return "Lagene er ikke klare ennå";
}

function kampStatusKlasse(kamp) {
  if (erKampTippebar(kamp) && erKampLevert(kamp.id)) return "saved";
  if (erKampTippebar(kamp)) return "open";
  return "locked";
}

function rundeErSynlig(runde) {
  const round = status?.[runde];
  if (!round) return false;
  return Boolean(round.aapen || (round.kamper || []).some(kamp => erKampLevert(kamp.id)));
}

function deltakerNoekkel() {
  const navn = document.getElementById("navnInput")?.value?.trim().toLowerCase() || "";
  return deltakerId || navn || "ukjent";
}

function hentAlleLeverteKamper() {
  try {
    return JSON.parse(localStorage.getItem("vm2026_leverte_kamper") || "{}") || {};
  } catch (error) {
    return {};
  }
}

function hentLeverteKamperForDeltaker() {
  return hentAlleLeverteKamper()[deltakerNoekkel()] || {};
}

function erKampLevert(kampId) {
  return Boolean(hentLeverteKamperForDeltaker()[kampId]);
}

function markerKamperLevert(kampIds) {
  const all = hentAlleLeverteKamper();
  const key = deltakerNoekkel();
  const participant = all[key] || {};
  const now = new Date().toISOString();
  kampIds.forEach(kampId => { participant[kampId] = now; });
  all[key] = participant;
  localStorage.setItem("vm2026_leverte_kamper", JSON.stringify(all));
}

function harLevertIRunde(runde) {
  return (status?.[runde]?.kamper || []).some(kamp => erKampLevert(kamp.id));
}

function harNyeTippebareKamper(runde) {
  return (status?.[runde]?.kamper || []).some(kamp => erKampTippebar(kamp) && !erKampLevert(kamp.id));
}

// ── BYGG UI ────────────────────────────────────────────────
function byggUI() {
  if (!status) return;
  byggTabs();
  byggSeksjoner();

  const fraLenke = RUNDE_REKKEFØLGE.includes(deepLinkRunde) && rundeErSynlig(deepLinkRunde) ? deepLinkRunde : null;
  const ønsket = aktivRunde && rundeErSynlig(aktivRunde) ? aktivRunde : null;
  const første = fraLenke || ønsket || RUNDE_REKKEFØLGE.find(runde => rundeErSynlig(runde)) || "r32";
  byttRunde(første);
  requestAnimationFrame(fokuserLenketKamp);
}

function byggTabs() {
  const tabs = document.getElementById("rundeTabs");
  tabs.innerHTML = "";

  RUNDE_REKKEFØLGE.forEach(runde => {
    const visible = rundeErSynlig(runde);
    const delivered = harLevertIRunde(runde);
    const newMatches = harNyeTippebareKamper(runde);
    const tab = document.createElement("div");
    tab.className = "runde-tab" + (!visible ? " locked" : "") + (delivered && !newMatches ? " done" : "");
    tab.id = "tab-" + runde;
    tab.textContent = RUNDE_NAVN[runde];

    if (newMatches || delivered) {
      const dot = document.createElement("span");
      dot.className = "dot";
      tab.appendChild(dot);
    }
    if (visible) tab.onclick = () => byttRunde(runde);
    tabs.appendChild(tab);
  });
}

function byggSeksjoner() {
  const container = document.getElementById("rundeSeksjoner");
  container.innerHTML = "";

  RUNDE_REKKEFØLGE.forEach(runde => {
    const section = document.createElement("div");
    section.className = "runde-seksjon";
    section.id = "seksjon-" + runde;
    const round = status[runde];

    if (!rundeErSynlig(runde)) {
      section.innerHTML = `
        <div class="ikke-aapen">
          <div class="ikon">🔒</div>
          <h3>${escapeHtml(RUNDE_NAVN[runde])}</h3>
          <p>Åpner så snart den første kampen har begge lag klare</p>
        </div>`;
    } else {
      section.innerHTML = byggRundeHTML(runde, round?.kamper || []);
    }
    container.appendChild(section);
  });
}

function byggRundeHTML(runde, kampListe) {
  const poeng = POENG[runde];
  const tippebare = kampListe.filter(erKampTippebar);
  const venter = kampListe.length - tippebare.length;
  const utfylte = tippebare.filter(kamp => harFulltResultat(kamp.id)).length;

  let html = `
    <div class="runde-header">
      <span class="runde-tag">${escapeHtml(RUNDE_NAVN[runde])}</span>
      <h2>${kampListe.length} kamper</h2>
      <div class="poeng-info">Utfall 90 min: <span>${poeng}p</span> · Eksakt: <span>+4p</span></div>
    </div>
    <div class="runde-oppsummering">
      <strong>${tippebare.length}</strong> åpne · <strong>${venter}</strong> venter eller stengt
    </div>
    <div class="autofill-wrap">
      <button class="btn-autofill" type="button" onclick="autofyllTommeIRunde('${runde}')" ${tippebare.length ? "" : "disabled"}>🎲 Autofyll tomme kamper</button>
      <div class="autofill-note">Fyller bare tomme kamper som er åpne akkurat nå.</div>
    </div>`;

  kampListe.forEach(kamp => {
    const tips = tippinger[kamp.id] || {};
    const tippebar = erKampTippebar(kamp);
    const erNorge = kamp.hjemme === "Norway" || kamp.borte === "Norway" || kamp.hjemme === "Norge" || kamp.borte === "Norge";
    const disabled = tippebar ? "" : "disabled";

    html += `
      <div class="kamp-kort ${tippebar ? "" : "locked-kamp"} ${erNorge ? "norge-kamp" : ""}" id="kort-${escapeHtml(kamp.id)}"
           data-match-no="${escapeHtml(kamp.match_no ?? "")}"
           style="${erNorge ? "border-color:rgba(239,43,45,.4);background:rgba(239,43,45,.04)" : ""}">
        <div class="kamp-status ${kampStatusKlasse(kamp)}">${escapeHtml(kampStatusTekst(kamp))}</div>
        <div class="lag-rad">
          <div>
            <div class="lag-navn">${escapeHtml(kamp.hjemme)}</div>
            <div class="lag-gruppe">${escapeHtml(kamp.info || "")}</div>
          </div>
          <div class="score-wrap">
            <input type="number" min="0" max="20" placeholder="–" ${disabled}
              id="h-${escapeHtml(kamp.id)}" value="${tips.hjemme ?? ""}"
              class="score-input-felt ${tips.hjemme !== undefined ? "filled" : ""}"
              oninput="oppdaterScore('${kamp.id}','${runde}')">
          </div>
        </div>
        <div class="lag-rad">
          <div><div class="lag-navn">${escapeHtml(kamp.borte)}</div></div>
          <div class="score-wrap">
            <input type="number" min="0" max="20" placeholder="–" ${disabled}
              id="b-${escapeHtml(kamp.id)}" value="${tips.borte ?? ""}"
              class="score-input-felt ${tips.borte !== undefined ? "filled" : ""}"
              oninput="oppdaterScore('${kamp.id}','${runde}')">
          </div>
        </div>
      </div>`;
  });

  html += `
    <div id="advarsel-${runde}"></div>
    <div class="lever-wrap">
      <button class="btn-lever" id="leverBtn-${runde}" onclick="leverRunde('${runde}')" ${tippebare.length ? "" : "disabled"}>
        💾 Lagre utfylte tips (${utfylte})
      </button>
    </div>`;
  return html;
}

// ── INTERAKSJON ────────────────────────────────────────────
function finnKamp(kampId, runde) {
  return status?.[runde]?.kamper?.find(kamp => kamp.id === kampId);
}

function oppdaterScore(kampId, runde) {
  const kamp = finnKamp(kampId, runde);
  if (!erKampTippebar(kamp)) return;

  const home = document.getElementById("h-" + kampId);
  const away = document.getElementById("b-" + kampId);
  if (!tippinger[kampId]) tippinger[kampId] = {};

  if (home.value !== "") {
    tippinger[kampId].hjemme = parseInt(home.value, 10);
    home.classList.add("filled");
  } else {
    delete tippinger[kampId].hjemme;
    home.classList.remove("filled");
  }

  if (away.value !== "") {
    tippinger[kampId].borte = parseInt(away.value, 10);
    away.classList.add("filled");
  } else {
    delete tippinger[kampId].borte;
    away.classList.remove("filled");
  }

  lagreTilStorage();
  oppdaterProgress();
  oppdaterLeverKnapp(runde);
}

function tilfeldigMaal() {
  return Math.floor(Math.random() * 4);
}

function autofyllTommeIRunde(runde) {
  const kampListe = (status?.[runde]?.kamper || []).filter(erKampTippebar);
  let fylt = 0;

  kampListe.forEach(kamp => {
    const home = document.getElementById("h-" + kamp.id);
    const away = document.getElementById("b-" + kamp.id);
    if (!home || !away) return;

    const lagret = tippinger[kamp.id] && tippinger[kamp.id].hjemme !== undefined && tippinger[kamp.id].borte !== undefined;
    if (lagret || home.value !== "" || away.value !== "") return;

    home.value = tilfeldigMaal();
    away.value = tilfeldigMaal();
    tippinger[kamp.id] = { hjemme: parseInt(home.value, 10), borte: parseInt(away.value, 10) };
    home.classList.add("filled");
    away.classList.add("filled");
    fylt += 1;
  });

  lagreTilStorage();
  oppdaterProgress();
  oppdaterLeverKnapp(runde);
  alert(fylt ? `Autofylte ${fylt} åpne kamp${fylt === 1 ? "" : "er"}.` : "Ingen åpne, tomme kamper å autofylle.");
}

function harFulltResultat(kampId) {
  const tips = tippinger[kampId];
  return Boolean(tips && Number.isInteger(tips.hjemme) && Number.isInteger(tips.borte));
}

function byttRunde(runde) {
  aktivRunde = runde;
  document.querySelectorAll(".runde-seksjon").forEach(element => element.classList.remove("active"));
  document.querySelectorAll(".runde-tab").forEach(element => element.classList.remove("active"));
  document.getElementById("seksjon-" + runde)?.classList.add("active");
  document.getElementById("tab-" + runde)?.classList.add("active");
  oppdaterProgress();
  oppdaterLeverKnapp(runde);
}

function fokuserLenketKamp() {
  if (deepLinkFokusert || !Number.isFinite(deepLinkKamp) || deepLinkKamp <= 0) return;
  const card = document.querySelector(`[data-match-no="${deepLinkKamp}"]`);
  if (!card) return;
  deepLinkFokusert = true;
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.classList.add("deep-link-target");
  setTimeout(() => card.classList.remove("deep-link-target"), 3200);
}

function oppdaterProgress() {
  const kampListe = (status?.[aktivRunde]?.kamper || []).filter(erKampTippebar);
  const total = kampListe.length;
  const antall = kampListe.filter(kamp => harFulltResultat(kamp.id)).length;
  const prosent = total ? Math.round((antall / total) * 100) : 0;
  document.getElementById("progressFill").style.width = prosent + "%";
  document.getElementById("progressCount").textContent = antall + " / " + total;
}

function oppdaterLeverKnapp(runde) {
  const button = document.getElementById("leverBtn-" + runde);
  if (!button) return;
  const antall = (status?.[runde]?.kamper || []).filter(kamp => erKampTippebar(kamp) && harFulltResultat(kamp.id)).length;
  button.textContent = `💾 Lagre utfylte tips (${antall})`;
}

// ── LEVERING ───────────────────────────────────────────────
async function leverRunde(runde) {
  const navn = document.getElementById("navnInput").value.trim();
  const warning = document.getElementById("advarsel-" + runde);
  if (!navn) {
    warning.innerHTML = '<div class="error-box">Du må velge hvem du er.</div>';
    return;
  }

  const åpne = (status?.[runde]?.kamper || []).filter(erKampTippebar);
  const utfylte = åpne.filter(kamp => harFulltResultat(kamp.id));
  if (!utfylte.length) {
    warning.innerHTML = '<div class="error-box">Fyll ut minst én åpen kamp før du lagrer.</div>';
    return;
  }

  const mangler = åpne.length - utfylte.length;
  warning.innerHTML = mangler
    ? `<div class="advarsel-box">${mangler} åpen kamp er ikke utfylt og blir ikke sendt nå.</div>`
    : "";

  const button = document.getElementById("leverBtn-" + runde);
  button.disabled = true;
  button.textContent = "⏳ Sender...";

  const payload = {
    meta: {
      navn,
      innlevert: new Date().toISOString(),
      token: TOKEN,
      runde,
      deltaker_id: deltakerId || null
    },
    tippinger: utfylte.map(kamp => ({
      kamp_id: kamp.id,
      match_no: kamp.match_no ?? null,
      hjemmelag: kamp.hjemme,
      bortelag: kamp.borte,
      hjemme: tippinger[kamp.id].hjemme,
      borte: tippinger[kamp.id].borte
    }))
  };

  try {
    const response = await fetch(SUBMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ runde, navn, data: payload })
    });
    if (!response.ok) {
      const error = await response.json().catch(() => null);
      throw new Error(error?.details || error?.error || "Submit-feil: " + response.status);
    }
    visSucces(navn, runde, utfylte.map(kamp => kamp.id));
  } catch (error) {
    button.disabled = false;
    oppdaterLeverKnapp(runde);
    warning.innerHTML += `<div class="error-box">Noe gikk galt: ${escapeHtml(error.message)}. Prøv igjen.</div>`;
  }
}

function visSucces(navn, runde, kampIds) {
  markerKamperLevert(kampIds);
  byggTabs();
  byggSeksjoner();
  byttRunde(runde);

  const success = document.getElementById("suksess");
  success.classList.add("vis");
  document.getElementById("suksessNavn").textContent =
    `${navn} — ${kampIds.length} tips lagret. Nye kamper kan leveres senere.`;
  success.scrollIntoView({ behavior: "smooth", block: "center" });
  window.setTimeout(() => success.classList.remove("vis"), 7000);
}

// ── LOCALSTORAGE ───────────────────────────────────────────
function lagreTilStorage() {
  localStorage.setItem("vm2026_utslagsrunder", JSON.stringify({
    navn: document.getElementById("navnInput").value,
    deltaker_id: deltakerId,
    tippinger
  }));
}

function lastFraStorage() {
  try {
    const raw = localStorage.getItem("vm2026_utslagsrunder");
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.navn) document.getElementById("navnInput").value = data.navn;
    if (data.deltaker_id) deltakerId = data.deltaker_id;
    if (data.tippinger) tippinger = data.tippinger;
  } catch (error) {
    // Ignorer ødelagt lokal lagring.
  }
}
</script>
