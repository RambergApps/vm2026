<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VM 2026 — Utslagsrunder</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  print-color-adjust: exact; -webkit-print-color-adjust: exact;
}
:root {
  --bg:      #0a0f1e;
  --surface: #111827;
  --card:    #1a2235;
  --border:  #2a3650;
  --accent:  #00e676;
  --accent2: #ffd600;
  --red:     #ff4444;
  --text:    #f0f4ff;
  --muted:   #7a8aaa;
  --locked:  #1a1f2e;
}
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── HERO ── */
.hero {
  background: linear-gradient(135deg, #0a0f1e 0%, #0d1f3c 50%, #0a1628 100%);
  border-bottom: 1px solid var(--border);
  padding: 32px 24px 28px;
  text-align: center;
}
.hero .badge {
  display: inline-block;
  background: var(--accent2);
  color: #000;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 11px;
  letter-spacing: .15em;
  padding: 4px 12px;
  border-radius: 2px;
  margin-bottom: 12px;
}
.hero h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(28px, 6vw, 52px);
  font-weight: 900;
  text-transform: uppercase;
  line-height: .95;
}
.hero h1 span { color: var(--accent2); }
.hero p { margin-top: 8px; color: var(--muted); font-size: 13px; }

/* ── RUNDE-TABS ── */
.runde-tabs {
  display: flex;
  gap: 0;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 0 16px;
}
.runde-tab {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 14px 16px;
  color: var(--muted);
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: all .2s;
}
.runde-tab:hover { color: var(--text); }
.runde-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
.runde-tab.locked { color: #3a4a65; cursor: default; }
.runde-tab.done { color: var(--accent); }
.runde-tab .dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-left: 6px;
  vertical-align: middle;
}

/* ── PROGRESS ── */
.progress-bar-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-bar-wrap .label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  white-space: nowrap;
  text-transform: uppercase;
}
.progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent2); border-radius: 3px; transition: width .3s; width: 0%; }
.progress-count { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; color: var(--accent2); white-space: nowrap; }

/* ── CONTAINER ── */
.container { max-width: 680px; margin: 0 auto; padding: 24px 16px 80px; }

/* ── RUNDE-SEKSJON ── */
.runde-seksjon { display: none; }
.runde-seksjon.active { display: block; }

/* ── RUNDE-HEADER ── */
.runde-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.runde-tag {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  background: var(--accent2);
  color: #000;
  padding: 3px 10px;
  border-radius: 3px;
}
.runde-header h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
}
.runde-header .poeng-info {
  margin-left: auto;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  color: var(--muted);
}
.runde-header .poeng-info span { color: var(--accent2); font-weight: 700; }

/* ── KAMP-KORT ── */
.kamp-kort {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 0;
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color .2s;
  page-break-inside: avoid;
}
.kamp-kort:hover { border-color: #3a4a65; }
.kamp-kort.locked-kamp {
  opacity: .5;
  pointer-events: none;
  background: var(--locked);
}

/* Lag-rader */
.lag-rad {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  padding: 12px 16px;
  transition: background .15s;
  gap: 12px;
}
.lag-rad:hover { background: rgba(255,255,255,.03); }
.lag-rad.valgt { background: rgba(0,230,118,.08); }
.lag-rad.valgt .lag-navn { color: var(--accent); }
.lag-rad + .lag-rad { border-top: 1px solid var(--border); }

.lag-navn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .02em;
  transition: color .15s;
}
.lag-gruppe {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
}

/* Score-input */
.score-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.score-input-felt {
  width: 40px; height: 40px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  outline: none;
  transition: border-color .2s;
  -moz-appearance: textfield;
}
.score-input-felt::-webkit-inner-spin-button,
.score-input-felt::-webkit-outer-spin-button { -webkit-appearance: none; }
.score-input-felt:focus { border-color: var(--accent2); }
.score-input-felt.filled { border-color: rgba(255,214,0,.4); }
.score-sep {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 900;
  color: var(--muted);
}




/* ── IKKE ÅPEN ── */
.ikke-aapen {
  text-align: center;
  padding: 48px 24px;
  color: var(--muted);
}
.ikke-aapen .ikon { font-size: 48px; margin-bottom: 16px; }
.ikke-aapen h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text);
  margin-bottom: 8px;
}
.ikke-aapen p { font-size: 14px; }

/* ── NAVN-INPUT ── */
.navn-wrap {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.navn-wrap label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.navn-wrap input,
.navn-wrap select {
  flex: 1;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 15px;
  font-family: 'Barlow', sans-serif;
  outline: none;
}
.navn-wrap input:focus,
.navn-wrap select:focus { border-color: var(--accent2); }
.navn-wrap select option { background: var(--surface); color: var(--text); }

/* ── LEVER-KNAPP ── */
.lever-wrap { margin-top: 24px; }
.btn-lever {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 14px 40px;
  border-radius: 6px;
  border: none;
  background: var(--accent2);
  color: #000;
  width: 100%;
  transition: all .2s;
}
.btn-lever:hover { background: #ffe033; transform: translateY(-1px); }
.btn-lever:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

/* ── SUKSESS ── */
.suksess {
  text-align: center;
  padding: 48px 24px;
  max-width: 480px;
  margin: 0 auto;
  display: none;
}
.suksess.vis { display: block; }
.suksess .emoji { font-size: 56px; margin-bottom: 16px; }
.suksess h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 32px;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.suksess p { color: var(--muted); font-size: 14px; }

/* ── ERROR ── */
.error-box {
  background: rgba(255,68,68,.1);
  border: 1px solid rgba(255,68,68,.3);
  border-radius: 8px;
  padding: 12px 16px;
  color: #ff8888;
  margin: 12px 0;
  font-size: 13px;
}
.advarsel-box {
  background: rgba(255,214,0,.08);
  border: 1px solid rgba(255,214,0,.25);
  border-radius: 8px;
  padding: 12px 16px;
  color: var(--accent2);
  margin: 12px 0;
  font-size: 13px;
}


.autofill-wrap {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin:0 0 20px;
}
.autofill-note {
  width:100%;
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:-4px;
}
.btn-autofill {
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:11px 22px;
  border-radius:6px;
  cursor:pointer;
  background:rgba(255,214,0,.12);
  color:var(--accent2);
  border:1.5px solid rgba(255,214,0,.35);
  transition:all .2s;
}
.btn-autofill:hover {
  background:rgba(255,214,0,.18);
  border-color:var(--accent2);
}

@media (max-width: 480px) {
  .lag-navn { font-size: 15px; }
  .runde-tab { padding: 12px 10px; font-size: 11px; }
}
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}
</style>
</head>
<body>

<div class="hero">
  <div class="badge">⚽ VM 2026 · Utslagsrunder</div>
  <h1>Tipp <span>utslagsrundene</span></h1>
  <p>Tipp resultat etter ordinær tid / 90 min. Ekstraomganger og straffer teller ikke.</p>
</div>

<!-- TABS -->
<div class="runde-tabs" id="rundeTabs"></div>

<!-- PROGRESS -->
<div class="progress-bar-wrap">
  <span class="label">Fullført</span>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <span class="progress-count" id="progressCount">0 / 0</span>
</div>

<div class="container">

  <!-- DELTAKER / NAVN -->
  <div class="navn-wrap">
    <label id="navnLabel">Ditt navn</label>
    <!-- Dropdown: vises når deltakere.json er lastet. Skjult ID — kun navn vises. -->
    <select id="deltakerSelect" style="display:none" aria-label="Velg deg selv">
      <option value="">— Velg deg selv —</option>
    </select>
    <!-- Tekstfelt: fallback og skjult kilde for navn-verdi ved levering -->
    <input type="text" id="navnInput" placeholder="Kari Nordmann" autocomplete="name">
  </div>

  <!-- RUNDE-SEKSJONER genereres dynamisk -->
  <div id="rundeSeksjoner"></div>

  <!-- SUKSESS -->
  <div class="suksess" id="suksess">
    <div class="emoji">🎉</div>
    <h2>Tipping levert!</h2>
    <p id="suksessNavn"></p>
  </div>

</div><!-- /container -->

<script>
// ── KONFIG ─────────────────────────────────────────────────
const SUBMIT_URL    = "https://vm2026-submit-api.vercel.app/api/submit";
const TOKEN         = "vm2026-ramberg";
const STATUS_URL    = "../data/status.json";
const DELTAKERE_URL = "../data/deltakere.json";   // ← NY: liste over kjente deltakere

// Poeng per runde
const POENG = { r32: 3, r16: 4, qf: 5, sf: 6, final: 7 };

const RUNDE_NAVN = {
  r32:   "Runde av 32",
  r16:   "Runde av 16",
  qf:    "Kvartfinale",
  sf:    "Semifinale",
  final: "Finale"
};

const RUNDE_REKKEFØLGE = ["r32","r16","qf","sf","final"];

// ── STATE ──────────────────────────────────────────────────
let status     = null;
let kamper     = {};      // { r32: [...], r16: [...], ... }
let tippinger  = {};      // { "kamp_id": { hjemme: 1, borte: 0 } }
let aktivRunde = null;
let deltakerId = null;    // ← NY: stabil ID satt når deltaker velges fra dropdown

// ── INIT ───────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  lastFraStorage();
  // Kjør parallelt: hent deltakerliste og kampstatus
  await Promise.all([hentDeltakere(), hentStatus()]);
});

async function hentStatus() {
  try {
    const r = await fetch(STATUS_URL + '?t=' + Date.now());
    status = await r.json();
  } catch(e) {
    // Demo-modus: simuler at R32 er åpen med eksempellag
    status = {
      r32:   { aapen: true,  kamper: demoKamper("r32") },
      r16:   { aapen: false, kamper: [] },
      qf:    { aapen: false, kamper: [] },
      sf:    { aapen: false, kamper: [] },
      final: { aapen: false, kamper: [] }
    };
  }
  byggUI();
}

// ── DELTAKERE ──────────────────────────────────────────────
/**
 * Henter data/deltakere.json og bygger dropdown med kjente deltakere.
 * Faller tilbake til vanlig tekstfelt hvis filen ikke finnes ennå
 * (f.eks. første gang, eller dersom ingen har levert gruppespill).
 */
async function hentDeltakere() {
  try {
    const r = await fetch(DELTAKERE_URL + '?t=' + Date.now());
    if (!r.ok) return;
    const data = await r.json();
    if (Array.isArray(data) && data.length > 0) {
      byggDeltakerDropdown(data);
    }
    // Hvis tom liste: behold tekstfelt som det er
  } catch(e) {
    // Nettverksfeil eller filen finnes ikke ennå — tekstfelt brukes
  }
}

/**
 * Bytter ut tekstfeltet med en dropdown over kjente deltakere.
 * ID-en er skjult for brukeren; de ser bare sitt eget navn i listen.
 */
function byggDeltakerDropdown(deltakere) {
  const sel   = document.getElementById('deltakerSelect');
  const input = document.getElementById('navnInput');
  const label = document.getElementById('navnLabel');

  // Sorter alfabetisk på navn
  deltakere.sort((a, b) => a.navn.localeCompare(b.navn, 'no'));

  deltakere.forEach(d => {
    const o = document.createElement('option');
    o.value = d.id;
    o.textContent = d.navn;
    sel.appendChild(o);
  });

  // Gjenopprett tidligere valg fra localStorage
  const lagretId = localStorage.getItem('vm2026_deltaker_id');
  if (lagretId) {
    const funnet = deltakere.find(d => d.id === lagretId);
    if (funnet) {
      sel.value    = lagretId;
      deltakerId   = lagretId;
      input.value  = funnet.navn;
    }
  }

  // Reager på nytt valg
  sel.addEventListener('change', () => {
    const funnet = deltakere.find(d => d.id === sel.value);
    if (funnet) {
      deltakerId  = funnet.id;
      input.value = funnet.navn;
      localStorage.setItem('vm2026_deltaker_id', deltakerId);
    } else {
      deltakerId  = null;
      input.value = '';
    }
    lagreTilStorage();
  });

  // Vis dropdown, skjul tekstfelt, oppdater label
  sel.style.display   = '';
  input.style.display = 'none';
  label.textContent   = 'Hvem er du?';
}


// ── DEMO-DATA ─────────────────────────────────────────────
// Brukes kun lokalt når status.json ikke er tilgjengelig.
// ID-er følger kamp_id()-formatet fra poengregning.py:
//   rens(team1)_rens(team2)_rens(dato)  →  "Spain_Panama_2026_06_28"
// Lagnavn er engelske (som API returnerer) for konsistens med poengregning.
function demoKamper(runde) {
  if (runde !== "r32") return [];
  return [
    { id:"Spain_Panama_2026_06_28",         hjemme:"Spain",       borte:"Panama",        dato:"2026-06-28", info:"" },
    { id:"Brazil_Scotland_2026_06_28",      hjemme:"Brazil",      borte:"Scotland",      dato:"2026-06-28", info:"" },
    { id:"France_South_Korea_2026_06_29",   hjemme:"France",      borte:"South Korea",   dato:"2026-06-29", info:"" },
    { id:"Norway_Jordan_2026_06_29",        hjemme:"Norway",      borte:"Jordan",        dato:"2026-06-29", info:"" },
    { id:"Argentina_Iran_2026_06_29",       hjemme:"Argentina",   borte:"Iran",          dato:"2026-06-29", info:"" },
    { id:"England_New_Zealand_2026_06_29",  hjemme:"England",     borte:"New Zealand",   dato:"2026-06-29", info:"" },
    { id:"Germany_Tunisia_2026_06_30",      hjemme:"Germany",     borte:"Tunisia",       dato:"2026-06-30", info:"" },
    { id:"Portugal_Cape_Verde_2026_06_30",  hjemme:"Portugal",    borte:"Cape Verde",    dato:"2026-06-30", info:"" },
    { id:"USA_Czech_Republic_2026_06_30",   hjemme:"USA",         borte:"Czech Republic",dato:"2026-06-30", info:"" },
    { id:"Belgium_Ecuador_2026_06_30",      hjemme:"Belgium",     borte:"Ecuador",       dato:"2026-06-30", info:"" },
    { id:"Netherlands_Uruguay_2026_07_01",  hjemme:"Netherlands", borte:"Uruguay",       dato:"2026-07-01", info:"" },
    { id:"Mexico_Colombia_2026_07_01",      hjemme:"Mexico",      borte:"Colombia",      dato:"2026-07-01", info:"" },
    { id:"Canada_Egypt_2026_07_01",         hjemme:"Canada",      borte:"Egypt",         dato:"2026-07-01", info:"" },
    { id:"Japan_Switzerland_2026_07_01",    hjemme:"Japan",       borte:"Switzerland",   dato:"2026-07-01", info:"" },
    { id:"Australia_Algeria_2026_07_02",    hjemme:"Australia",   borte:"Algeria",       dato:"2026-07-02", info:"" },
    { id:"South_Africa_Morocco_2026_07_02", hjemme:"South Africa",borte:"Morocco",       dato:"2026-07-02", info:"" }
  ];
}

// ── BYGG UI ────────────────────────────────────────────────
function byggUI() {
  byggTabs();
  byggSeksjoner();
  // Aktiver første åpne runde
  const første = RUNDE_REKKEFØLGE.find(r => status[r]?.aapen);
  if (første) byttRunde(første);
  else byttRunde("r32");
  oppdaterProgress();
}

function byggTabs() {
  const tabs = document.getElementById("rundeTabs");
  tabs.innerHTML = "";
  RUNDE_REKKEFØLGE.forEach(r => {
    const st = status[r];
    const div = document.createElement("div");
    div.className = "runde-tab" +
      (!st?.aapen && !harLevert(r) ? " locked" : "") +
      (harLevert(r) ? " done" : "");
    div.id = "tab-" + r;
    div.textContent = RUNDE_NAVN[r];
    if (harLevert(r)) {
      const dot = document.createElement("span");
      dot.className = "dot";
      div.appendChild(dot);
    }
    if (st?.aapen || harLevert(r)) div.onclick = () => byttRunde(r);
    tabs.appendChild(div);
  });
}

function byggSeksjoner() {
  const cont = document.getElementById("rundeSeksjoner");
  cont.innerHTML = "";
  RUNDE_REKKEFØLGE.forEach(r => {
    const div = document.createElement("div");
    div.className = "runde-seksjon";
    div.id = "seksjon-" + r;
    const st = status[r];

    if (!st?.aapen) {
      div.innerHTML = `
        <div class="ikke-aapen">
          <div class="ikon">🔒</div>
          <h3>${RUNDE_NAVN[r]}</h3>
          <p>Åpner når forrige runde er ferdigspilt</p>
        </div>`;
    } else {
      div.innerHTML = byggRundeHTML(r, st.kamper);
    }
    cont.appendChild(div);
  });
}

function byggRundeHTML(runde, kampListe) {
  const p = POENG[runde];
  let html = `
    <div class="runde-header">
      <span class="runde-tag">${RUNDE_NAVN[runde]}</span>
      <h2>${kampListe.length} kamper</h2>
      <div class="poeng-info">Utfall 90 min: <span>${p}p</span> · Eksakt: <span>+4p</span></div>
    </div>
    <div class="autofill-wrap">
      <button class="btn-autofill" type="button" onclick="autofyllTommeIRunde('${runde}')">🎲 Autofyll tomme kamper</button>
      <div class="autofill-note">Fyller bare tomme kamper i denne runden. Resultater settes tilfeldig fra 0 til 3 mål.</div>
    </div>`;

  kampListe.forEach(k => {
    const t = tippinger[k.id] || {};
    const erNorge = k.hjemme === "Norge" || k.borte === "Norge";

    html += `
      <div class="kamp-kort ${erNorge ? 'norge-kamp' : ''}" id="kort-${k.id}"
           style="${erNorge ? 'border-color:rgba(239,43,45,.4);background:rgba(239,43,45,.04)' : ''}">

        <!-- Hjemmelag -->
        <div class="lag-rad">
          <div>
            <div class="lag-navn">${k.hjemme}</div>
            <div class="lag-gruppe">${k.info || ''}</div>
          </div>
          <div class="score-wrap">
            <input type="number" min="0" max="20" placeholder="–"
              id="h-${k.id}" value="${t.hjemme ?? ''}"
              class="score-input-felt ${t.hjemme !== undefined ? 'filled' : ''}"
              oninput="oppdaterScore('${k.id}','${runde}')">
          </div>
        </div>

        <!-- Bortelag -->
        <div class="lag-rad">
          <div>
            <div class="lag-navn">${k.borte}</div>
          </div>
          <div class="score-wrap">
            <input type="number" min="0" max="20" placeholder="–"
              id="b-${k.id}" value="${t.borte ?? ''}"
              class="score-input-felt ${t.borte !== undefined ? 'filled' : ''}"
              oninput="oppdaterScore('${k.id}','${runde}')">
          </div>
        </div>

      </div>`;
  });

  html += `
    <div id="advarsel-${runde}"></div>
    <div class="lever-wrap">
      <button class="btn-lever" id="leverBtn-${runde}"
        onclick="leverRunde('${runde}')">
        🚀 Lever tipping — ${RUNDE_NAVN[runde]}
      </button>
    </div>`;

  return html;
}

// ── INTERAKSJON ────────────────────────────────────────────
function oppdaterScore(kampId, runde) {
  const h = document.getElementById("h-" + kampId);
  const b = document.getElementById("b-" + kampId);
  if (!tippinger[kampId]) tippinger[kampId] = {};

  if (h.value !== "") {
    tippinger[kampId].hjemme = parseInt(h.value, 10);
    h.classList.add("filled");
  } else {
    delete tippinger[kampId].hjemme;
    h.classList.remove("filled");
  }

  if (b.value !== "") {
    tippinger[kampId].borte = parseInt(b.value, 10);
    b.classList.add("filled");
  } else {
    delete tippinger[kampId].borte;
    b.classList.remove("filled");
  }

  lagreTilStorage();
  oppdaterProgress();
}

function tilfeldigMaal() {
  return Math.floor(Math.random() * 4);
}

function autofyllTommeIRunde(runde) {
  const kampListe = status[runde]?.kamper || [];
  let fylt = 0;

  kampListe.forEach(k => {
    const h = document.getElementById('h-' + k.id);
    const b = document.getElementById('b-' + k.id);
    if (!h || !b) return;

    const harLagret = tippinger[k.id] && tippinger[k.id].hjemme !== undefined && tippinger[k.id].borte !== undefined;
    const harFelt = h.value !== '' || b.value !== '';
    if (harLagret || harFelt) return;

    h.value = tilfeldigMaal();
    b.value = tilfeldigMaal();
    tippinger[k.id] = { hjemme: parseInt(h.value, 10), borte: parseInt(b.value, 10) };
    h.classList.add('filled');
    b.classList.add('filled');
    fylt++;
  });

  lagreTilStorage();
  oppdaterProgress();

  if (fylt === 0) {
    alert('Ingen tomme kamper å autofylle i denne runden.');
  } else {
    alert('Autofylte ' + fylt + ' tomme kamper i ' + RUNDE_NAVN[runde] + '.');
  }
}

function finnKamp(kampId, runde) {
  return status[runde]?.kamper?.find(k => k.id === kampId);
}

function harFulltResultat(kampId) {
  const t = tippinger[kampId];
  return t && t.hjemme !== undefined && t.borte !== undefined;
}

// ── TABS ───────────────────────────────────────────────────
function byttRunde(runde) {
  aktivRunde = runde;
  document.querySelectorAll(".runde-seksjon").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".runde-tab").forEach(t => t.classList.remove("active"));
  document.getElementById("seksjon-" + runde)?.classList.add("active");
  document.getElementById("tab-" + runde)?.classList.add("active");
  oppdaterProgress();
}

// ── PROGRESS ───────────────────────────────────────────────
function oppdaterProgress() {
  if (!aktivRunde || !status[aktivRunde]?.aapen) return;
  const kampListe = status[aktivRunde]?.kamper || [];
  const total = kampListe.length;
  const antall = kampListe.filter(k => harFulltResultat(k.id)).length;
  const pct = total > 0 ? Math.round(antall / total * 100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressCount").textContent = antall + " / " + total;
}

// ── LEVER ──────────────────────────────────────────────────
async function leverRunde(runde) {
  const navn = document.getElementById("navnInput").value.trim();
  if (!navn) {
    document.getElementById("advarsel-" + runde).innerHTML =
      '<div class="error-box">Du må velge hvem du er.</div>';
    return;
  }

  const kampListe = status[runde]?.kamper || [];
  const mangler   = kampListe.filter(k => !harFulltResultat(k.id)).length;

  if (mangler > 0) {
    document.getElementById("advarsel-" + runde).innerHTML =
      `<div class="advarsel-box">⚠ ${mangler} kamp${mangler > 1 ? 'er' : ''} mangler resultat. Disse gir 0 poeng.</div>`;
  } else {
    document.getElementById("advarsel-" + runde).innerHTML = "";
  }

  const btn = document.getElementById("leverBtn-" + runde);
  btn.disabled    = true;
  btn.textContent = "⏳ Sender...";

  const payload = {
    meta: {
      navn:        navn,
      innlevert:   new Date().toISOString(),
      token:       TOKEN,
      runde:       runde,
      deltaker_id: deltakerId || null   // ← NY: kobler til gruppespill-profil
    },
    tippinger: kampListe.map(k => ({
      kamp_id:   k.id,
      hjemmelag: k.hjemme,
      bortelag:  k.borte,
      hjemme:    tippinger[k.id]?.hjemme ?? null,
      borte:     tippinger[k.id]?.borte  ?? null
    }))
  };

  try {
    const resp = await fetch(SUBMIT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        runde: runde,
        navn: navn,
        data: payload
      })
    });

    if (resp.ok) {
      visSucces(navn, runde);
    } else {
      const feil = await resp.json().catch(() => null);
      throw new Error(
        feil?.details || feil?.error || 'Submit-feil: ' + resp.status
      );
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = "🚀 Prøv igjen";
    document.getElementById("advarsel-" + runde).innerHTML +=
      `<div class="error-box">Noe gikk galt: ${e.message}. Prøv igjen.</div>`;
  }
}

function visSucces(navn, runde) {
  markerLevert(runde);
  byggTabs();
  document.getElementById("suksess").classList.add("vis");
  document.getElementById("suksessNavn").textContent =
    navn + " — " + RUNDE_NAVN[runde] + " levert ✓";
  document.getElementById("rundeSeksjoner").style.display = "none";
  window.scrollTo(0, 0);
}

// ── LOCALSTORAGE ───────────────────────────────────────────
function lagreTilStorage() {
  localStorage.setItem("vm2026_utslagsrunder", JSON.stringify({
    navn:        document.getElementById("navnInput").value,
    deltaker_id: deltakerId,   // ← NY
    tippinger:   tippinger
  }));
}

function lastFraStorage() {
  try {
    const raw = localStorage.getItem("vm2026_utslagsrunder");
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.navn)        document.getElementById("navnInput").value = data.navn;
    if (data.deltaker_id) deltakerId = data.deltaker_id;   // ← NY
    if (data.tippinger)   tippinger  = data.tippinger;
  } catch(e) {}
}

function markerLevert(runde) {
  try {
    const levert = JSON.parse(localStorage.getItem("vm2026_levert") || "[]");
    if (!levert.includes(runde)) levert.push(runde);
    localStorage.setItem("vm2026_levert", JSON.stringify(levert));
  } catch(e) {}
}

function harLevert(runde) {
  try {
    const levert = JSON.parse(localStorage.getItem("vm2026_levert") || "[]");
    return levert.includes(runde);
  } catch(e) { return false; }
}
</script>
